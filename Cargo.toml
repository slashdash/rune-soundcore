[package]
name = "rune-soundcore"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["the rune-soundcore authors"]
description = "A macOS configuration app for Soundcore earbuds, built with Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
openscq30-lib = { git = "https://github.com/SeanathanVT/OpenSCQ30", rev = "b3b48cf377b306aed6b7fe8c434260b5c5ea1701", features = [
    "bundled-dependencies",
] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
macaddr = "1"
openscq30-i18n = { git = "https://github.com/SeanathanVT/OpenSCQ30", rev = "b3b48cf377b306aed6b7fe8c434260b5c5ea1701" }
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# Rune ships vendored forks of these crates (see its root Cargo.toml). A dependency's
# `[patch]` does not apply to the workspace that depends on it, so every consumer repeats them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
winit = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
